# Decap CMS config for the MyPeptidePrice deals portal.
# Login uses the Netlify Identity + Git Gateway you already enabled.

backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://mypeptideprice.com
display_url: https://mypeptideprice.com
logo_url: https://mypeptideprice.com/assets/brand/logo-symbol.png

collections:
  - name: deals
    label: "Deals & Promotions"
    label_singular: "Deal"
    description: "Add, edit, or end vendor deals. Changes go live across the announcement strip, deal carousel, and Today's Deals roundup automatically. See what's live and catch problems at /admin/deals-status.html"
    files:
      - name: deals
        label: "All Deals"
        file: "data/deals.json"
        fields:
          - label: "Deals"
            name: "deals"
            widget: "list"
            allow_add: true
            summary: "{{fields.vendor}}: {{fields.headline}}"
            fields:

              # ── STEP 1: THE BASICS (fill these for every deal) ──
              - label: "① Vendor"
                name: "vendor"
                widget: "select"
                hint: "Which vendor is running this deal."
                options:
                  # VENDOR-OPTIONS-START:deals
                  - "Aurora Peptides"
                  - "Bioedge Research Labs"
                  - "Coffee and Peppers"
                  - "Disguised Alpha"
                  - "Flawless Compounds"
                  - "Glacier Aminos"
                  - "Glow Aminos"
                  - "High Tide Compounds"
                  - "Instant Peptides"
                  - "Ion Peptide"
                  - "LabSourced Peptides"
                  - "Mile High Peptides"
                  - "Oneday Compounds"
                  - "Orbitrex Peptides"
                  - "Solyn Labs"
                  - "Southern Aminos"
                  - "SammyC's Skool"
                  # VENDOR-OPTIONS-END:deals

              - label: "② Deal type"
                name: "type"
                widget: "select"
                hint: "Pick the kind of deal. This decides which pricing fields below you need to fill in (see the notes on each)."
                options:
                  - { label: "Sitewide sale, a % off the whole store", value: "sitewide_sale" }
                  - { label: "Code only, just the SAMMYC code, no sale", value: "code_only" }
                  - { label: "Conditional, buy-x-get-y or bulk pricing", value: "conditional" }
                  - { label: "First order, new-customer code", value: "first_order" }
                  - { label: "New partner, 'now tracked' announcement", value: "new_partner" }
                  - { label: "Community, Skool or other announcement", value: "community" }

              - label: "③ Headline"
                name: "headline"
                widget: "string"
                hint: "The short line people see, e.g. '40% off sitewide'. Keep it to a few words."

              - label: "④ Description"
                name: "description"
                widget: "text"
                required: false
                hint: "Optional. A full sentence with the details, shown in the big deal carousel."

              # STEP 2: PRICING, only for Sitewide sale deals
              # For every other deal type, LEAVE ALL FOUR OF THESE BLANK.
              - label: "---  PRICING (only for a Sitewide sale)  ---"
                name: "_pricing_divider"
                widget: "hidden"
                required: false

              - label: "Sale %, the storewide discount"
                name: "sale_percent"
                widget: "number"
                required: false
                value_type: "int"
                min: 0
                max: 100
                hint: "The store's own sale %, e.g. 40. Pair this with 'Extra code %' below. LEAVE BLANK for a flat-rate deal or any non-sale deal."

              - label: "Extra code %, what SAMMYC stacks on top"
                name: "code_percent"
                widget: "number"
                required: false
                value_type: "int"
                min: 0
                max: 100
                hint: "The extra % the code adds on top of the sale, usually 15 (sometimes 10). Blank = use the vendor's default."

              - label: "OR Flat rate %, one all-in number, no stacking"
                name: "flat_rate"
                widget: "number"
                required: false
                value_type: "int"
                min: 0
                max: 100
                hint: "Use this INSTEAD of the two fields above when the deal is a single number that does NOT stack, e.g. Mile High '34% off with any code'. If you fill this, leave Sale % and Extra code % blank."

              - label: "Limit to categories"
                name: "scope_categories"
                widget: "select"
                multiple: true
                required: false
                hint: "Almost always leave EMPTY (whole-store sale). Only set this for a sale limited to certain products, e.g. a GLP-only weekend."
                options:
                  - "GLP-1 & Incretin"
                  - "Cognitive & Nootropic"
                  - "Metabolic & Mitochondrial"
                  - "Repair & Recovery"
                  - "Growth Hormone Research"
                  - "Longevity & Cellular Health"
                  - "Skin, Tanning & Sexual Health"
                  - "Bioregulators"
                  - "Supplies"

              - label: "Coupon code"
                name: "code"
                widget: "string"
                required: false
                default: "SAMMYC"
                hint: "Usually SAMMYC. For a first-order deal, put their code here instead, e.g. NEWCOFFEE20."

              # ── STEP 3: TIMING (blank dates = ongoing / always on) ──
              - label: "---  TIMING (blank dates = ongoing deal)  ---"
                name: "_timing_divider"
                widget: "hidden"
                required: false

              - label: "Start date"
                name: "start_date"
                widget: "datetime"
                required: false
                date_format: "YYYY-MM-DD"
                time_format: false
                picker_utc: false
                hint: "When it begins. Blank = it's already live."

              - label: "End date"
                name: "end_date"
                widget: "datetime"
                required: false
                date_format: "YYYY-MM-DD"
                time_format: false
                picker_utc: false
                hint: "Last day of the deal. Blank = ongoing / always on."

              - label: "Timezone"
                name: "timezone"
                widget: "select"
                default: "America/New_York"
                hint: "The vendor's timezone, so the end date is correct. Eastern for most."
                options:
                  - { label: "Eastern (most vendors)", value: "America/New_York" }
                  - { label: "Central", value: "America/Chicago" }
                  - { label: "Mountain", value: "America/Denver" }
                  - { label: "Pacific", value: "America/Los_Angeles" }

              # ── STEP 4: WHERE IT SHOWS ──
              - label: "---  WHERE IT SHOWS  ---"
                name: "_display_divider"
                widget: "hidden"
                required: false

              - label: "Show in"
                name: "show_in"
                widget: "select"
                multiple: true
                default: ["deals"]
                hint: "Deals appear in both the big slider and the Today's Deals panel together. Announcements appear in the sticky bar at the top of the page. Most vendor offers are just Deals. New partners, restocks and community news are Announcements. Tick both only if an offer is genuinely worth the top bar."
                options:
                  - { label: "Deal carousel and Today's Deals", value: "deals" }
                  - { label: "Announcement bar (top of page)", value: "announcement" }

              - label: "Affiliate URL"
                name: "affiliate_url"
                widget: "string"
                required: false
                hint: "Optional. Blank = use the vendor's default link."

              - label: "Priority"
                name: "priority"
                widget: "number"
                required: false
                value_type: "int"
                default: 300
                hint: "Optional. Higher shows first when deals compete for a spot. Big sales ~500, ongoing offers ~200. 300 is a fine default."

  - name: giveaways
    label: "Giveaways"
    label_singular: "Giveaway"
    description: "Add or end giveaways. These appear behind the Giveaways pill in the site header and nowhere else. A giveaway shows automatically between its start and end dates, then disappears on its own, so there is nothing to switch off afterwards."
    files:
      - name: giveaways
        label: "All Giveaways"
        file: "data/giveaways.json"
        fields:
          - label: "Giveaways"
            name: "giveaways"
            widget: "list"
            allow_add: true
            summary: "{{fields.host}}: {{fields.title}}"
            fields:

              - label: "① Title"
                name: "title"
                widget: "string"
                hint: "What someone can win, in a short line. Example: Win a $250 Southern Aminos bundle."

              - label: "② Who is running it"
                name: "host"
                widget: "select"
                default: "MyPeptidePrice"
                hint: "Pick MyPeptidePrice for anything we run ourselves, or the partner vendor if it is a joint giveaway."
                options:
                  # VENDOR-OPTIONS-START:giveaways
                  - "MyPeptidePrice"
                  - "SammyC"
                  - "Aurora Peptides"
                  - "Bioedge Research Labs"
                  - "Coffee and Peppers"
                  - "Disguised Alpha"
                  - "Flawless Compounds"
                  - "Glacier Aminos"
                  - "Glow Aminos"
                  - "High Tide Compounds"
                  - "Instant Peptides"
                  - "Ion Peptide"
                  - "LabSourced Peptides"
                  - "Mile High Peptides"
                  - "Oneday Compounds"
                  - "Orbitrex Peptides"
                  - "Solyn Labs"
                  - "Southern Aminos"
                  # VENDOR-OPTIONS-END:giveaways

              - label: "③ Description"
                name: "description"
                widget: "text"
                hint: "What it is and how to enter. Keep it factual. Do not describe what any product does or is used for."

              - label: "④ Where it appears"
                name: "show_in"
                widget: "select"
                multiple: true
                default: ["panel"]
                hint: "Giveaways always belong in the Giveaways panel. Tick the announcement bar as well only for ones worth the top of every page, the same way deals work."
                options:
                  - { label: "Giveaways panel", value: "panel" }
                  - { label: "Announcement bar (top of page)", value: "announcement" }

              - label: "⑤ Prize"
                name: "prize"
                widget: "string"
                required: false
                hint: "Optional short line shown as its own chip. Example: $250 store credit."

              # widget: "date" was removed in Decap 3.x and renders as
              # "No control for widget 'date'". datetime with time_format off is
              # the date-only replacement, matching the deals collection above.
              - label: "⑥ Starts"
                name: "start_date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                picker_utc: false
                format: "YYYY-MM-DD"
                hint: "The giveaway appears in the header from this date."

              - label: "⑦ Ends"
                name: "end_date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                picker_utc: false
                format: "YYYY-MM-DD"
                hint: "Last day it runs, included. It disappears by itself the day after."

              - label: "⑧ Timezone"
                name: "timezone"
                widget: "select"
                default: "America/New_York"
                required: false
                options:
                  - "America/New_York"
                  - "America/Chicago"
                  - "America/Denver"
                  - "America/Los_Angeles"

              - label: "⑨ Entry link"
                name: "entry_url"
                widget: "string"
                hint: "Where the Enter button goes. Must start with https://. Instagram post, Skool, a form, wherever entries are collected."

              - label: "⑩ Button text"
                name: "cta_text"
                widget: "string"
                required: false
                default: "Enter now"
                hint: "Optional. Examples: Enter on Instagram, Enter on Skool."

              - label: "⑪ Official rules link"
                name: "rules_url"
                widget: "string"
                required: false
                hint: "Strongly recommended. US giveaways are generally expected to publish official rules, eligibility, and no-purchase-necessary wording, and it matters more when a partner brand is involved. The build logs a warning when this is empty."

              - label: "⑫ Image"
                name: "image"
                widget: "image"
                required: false
                hint: "Optional. Shown at the top of the giveaway card."

              - label: "⑬ Feature this one"
                name: "featured"
                widget: "boolean"
                required: false
                default: false
                hint: "Pins it to the top of the panel."
