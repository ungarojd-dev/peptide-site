[build]
  functions = "netlify/functions"
  # Runs on every deploy. build-promotions expands the human-edited
  # data/deals.json (from the /admin portal) into data/promotions.json, THEN
  # the catalog fallback rebuilds using it, then SEO and programmatic pages.
  # Order matters: promotions before fallback before seo/pages.
  command = "node scripts/build-promotions.mjs && node scripts/build-catalog-fallback.mjs && node scripts/build-catalog-seo.mjs && node scripts/build-programmatic-pages.mjs"

[functions]
  node_bundler = "esbuild"

[functions."refresh-catalog-snapshot"]
  schedule = "*/15 * * * *"

[functions."catalog-refresh-background"]
  background = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/data/catalog-fallback-snapshot.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=21600"

[[headers]]
  for = "/admin/catalog-status.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
